[SystemSettings]
; Visual pass: the diffuse GI here is low-frequency, so a coarser Lumen final gather is invisible and saves about 1 ms.
r.Lumen.ScreenProbeGather.DownsampleFactor=32
; Tilt-shift depth of field is the most expensive post pass; one ring fewer in the gather is not noticeable at these blur sizes.
r.DOF.Gather.RingCount=4
; Crisper than the soft HD-2D references (PLAN.md asks for more definition).
r.Tonemapper.Sharpen=0.5
; Volumetric fog at the engine's default froxel grid: the haze is thin since the 4x map (optimisation pass), so the
; finer grid the dense light-shaft look needed (6 px, 128 slices) no longer pays for itself (~1 ms GPU).
r.VolumetricFog.HistoryWeight=0.92
; Shadow flicker: since 5.7 the directional receiver mask makes the virtual shadow map invalidate constantly for
; anything with world-position offset (our swaying firs and grass, the troops' billboard cards), which shows as
; shimmering shadows. Off, the cache behaves; the foliage instances are also cached rigidly (build_battlefield_visuals).
r.Shadow.Virtual.UseReceiverMaskDirectional=0
; Optimisation pass: the tilt-shift blur's recombine was the single most expensive pass (~3.5 ms at 1080p). Quality 0
; saves ~1.2 ms; at the blur sizes used the difference is not visible.
r.DOF.Recombine.Quality=0
