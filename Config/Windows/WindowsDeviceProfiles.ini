; Desktop Windows (a discrete or integrated Direct3D 12 GPU) rendering overrides, applied at DeviceProfile priority:
; they outrank BaseScalability.ini, while UVLGraphics' ECVF_SetByCode presets and console overrides still take
; precedence. The counterpart of Config/Mac/MacDeviceProfiles.ini; only what holds on any GPU is taken from there.
[Windows DeviceProfile]
; All world materials (including water) are Opaque or Masked; the only translucent material is the Unlit placement
; ghost, which does not read the translucency lighting volume. Not computing it saved ~1.3 ms of GPU a frame on the
; Mac (Docs/Optimization/AppleSilicon/PROPOSAL.md, rank 1) with no pixel changed; the work is the same on Direct3D.
; (r.Lumen.TranslucencyVolume.Enable stays 1 so that the volumetric fog keeps Lumen's bounce light.)
+CVars=r.TranslucencyLightingVolume=0
; NOT taken from the Mac's profile, on purpose (see Docs/Optimization/Windows/PROPOSAL.md):
;   r.Nanite=0                          there it removes a depth prepass that a tile-based GPU does not need; an
;                                       immediate-mode desktop GPU gains from that prepass (early Z)
;   r.Shadow.Virtual.MaxPhysicalPages   a unified-memory saving; a desktop card has its own memory
;   [TextureStreaming] / r.Streaming.PoolSize   the same: the engine's Windows default (70 % of the card's memory as
;                                       the ceiling) is harmless with textures this small
