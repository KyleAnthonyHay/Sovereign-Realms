; Windows: Direct3D 12 with SM6 shaders alone. The engine's default also cooks SM5 for Direct3D 11 and 12 (old GPUs),
; which this game's renderer - Lumen, virtual shadow maps - does not run on anyway: the D3D11 game would be another,
; untested look. The counterpart of Config/Mac/MacEngine.ini (Metal SM6 alone).
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
; no Direct3D 11 target at all (nothing is cooked for it; a machine without Direct3D 12 gets the engine's message)
-D3D11TargetedShaderFormats=PCD3D_SM5
; (no Vulkan target either: none is listed by the engine's defaults, and none is added here)
; Hardware ray tracing stays off as on the Mac: r.RayTracing is not set by the project (the engine's default is 0), so
; no ray tracing shaders are cooked and Lumen traces the distance fields, the same as there.

[SystemSettings]
; Pipeline states compiled ahead of their first draw (the engine's own PCD3D_SM6 entry in
; [/Script/Engine.PSOPrecacheSettingsManager] already sets the thread counts): no first-sight hitch when a new troop,
; effect or building comes into view. Said here as on the Mac (Config/Mac/MacEngine.ini), whatever the engine's default.
r.PSOPrecaching=1
r.PSOPrecache.GlobalShaders=1

; The game draws in the display's real pixels. The engine's default (BaseEngine.ini: False) leaves a packaged game
; DPI-unaware: on a display scaled by Windows (a 4K monitor at 175 %) the game was told the desktop is 2194 x 1234,
; no window or full-screen mode could be larger, and Windows stretched the picture to the screen. With it on
; (FSlateApplication::InitHighDPI -> SetProcessDpiAwareness, per monitor) the back buffer is the monitor's own
; 3840 x 2160. The HUD is laid out from the view's height (AVLHUD::BeginFrame), so it keeps its size on the screen;
; the 3D picture is rendered at the engine's automatic share of the output (r.ScreenPercentage 0: about 50 % of 4K,
; upscaled by TSR) times the game's Render scale, as on every display. Windows only: the Mac's Retina handling is
; the Mac platform layer's own. (-nohighdpi on the command line switches it off for a run.)
[/Script/Engine.UserInterfaceSettings]
bAllowHighDPIInGameMode=True
; (the capture scripts start the game -unattended, which would otherwise leave it DPI-unaware again)
bAllowHighDpiWhenUnattended=True
