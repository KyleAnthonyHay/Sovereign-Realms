; Apple Silicon / Metal TBDR rendering overrides (applied at DeviceProfile priority: outranks BaseScalability.ini,
; while UVLGraphics' ECVF_SetByCode presets and console overrides still take precedence).
[Mac DeviceProfile]
; Disable Nanite at runtime (keep r.Nanite.ProjectEnabled=1 because UE 5.8 gates Virtual Shadow Maps on it).
; Combined with r.DBuffer=False, this removes the forced full-scene depth prepass ("PrePass (Forced by Nanite)"),
; letting Apple GPU tile-based hidden-surface removal (HSR) cull hidden fragments without duplicating opaque vertex work.
+CVars=r.Nanite=0
; Optional 32-bit PF_FloatR11G11B10 HDR SceneColor (UE 5.8 MetalRHI enables TypedUAVLoad/TypedUAVStore on Apple Silicon,
; halving SceneColor tile/DRAM bandwidth). Kept off on default High because 6/6/5-bit mantissas can introduce subtle
; sky/volumetric-fog banding; test at runtime with `r.SceneColorFormat 2` (default is 4) or uncomment after visual check.
;+CVars=r.SceneColorFormat=2
; The game has a single shadow-casting light (the sun; lamps do not cast shadows). Halving the VSM physical page pool
; from 4096 to 2048 saves ~128-256 MB of unified memory on 8-16 GB MacBooks with zero visual change at High.
+CVars=r.Shadow.Virtual.MaxPhysicalPages=2048
; All world materials (including water) are Opaque or Masked; the only translucent material is the Unlit placement
; ghost. Disabling the forward translucency lighting volume saves ~1.3 ms GPU per frame.
; (r.Lumen.TranslucencyVolume.Enable stays 1 so VolumetricFog keeps Lumen GI bounce; set it to 0 if testing further.)
+CVars=r.TranslucencyLightingVolume=0
; (Backed out at the merge: r.Lumen.Reflections.MaxRoughnessToTrace=0.55. The engine's default, which no Sovereign Realms
; level overrides, is the post-process volume's 0.4 (Scene.cpp), and the cvar replaces it when >= 0: 0.55 would RAISE
; the cap, tracing dedicated rays on gold (0.42), metal and windows (0.5) that today use the cheaper screen/radiance
; fallback - more GPU, and a change of the High look.)
