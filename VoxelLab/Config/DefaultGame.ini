; Everything in /Game/Voxel is cooked, referenced by a map or not: the game loads its assets by name (sounds
; S_<name>, building and prop meshes SM_<name>, the troops' DA_<Kind>, the enemy's MI_<name>_Enemy twins, the UI atlases).
+DirectoriesToAlwaysCook=(Path="/Game/Voxel")
; ...except the old king models in /Game/Voxel/Meshes below (the generic importer's copies: Tools/ue/import_assets.py
; imports every glTF there). Nothing refers to them (no map, no asset) and no code loads them: the king is
; /Game/Voxel/King/DA_King with its parts in /Game/Voxel/King, all of which stay cooked. One line a package (the cooker
