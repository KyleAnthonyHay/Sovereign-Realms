; the hero renders custom depth so that M_Silhouette can show him through trees and buildings
r.CustomDepth=3
; VoxelLab uses no MegaLights and no DBuffer decals. Disabling MegaLights omits ~22 MB of unused SM6 compute
; shaders from the cook; disabling DBuffer removes decal base-pass fetches, shader permutations, and one of the
; triggers that forces a full depth prepass.
r.MegaLights.Supported=False
r.DBuffer=False

[SystemSettings]
r.Tonemapper.Sharpen=0.6
; same reason as the game: world-position offset (swaying leaves, banners) makes the directional receiver mask
; invalidate the virtual shadow map every frame, which shimmers
r.Shadow.Virtual.UseReceiverMaskDirectional=0
; Lumen's final gather was the most expensive pass by far (8-12 ms at 1600x900): thousands of small voxel meshes to
; trace. A coarser gather and tracing only the global distance field keep the same soft bounce light at about a third
; of the cost.
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.TraceMeshSDFs=0
; Temporal super resolution kept its history at 200 % of the output (the engine's Epic anti-aliasing quality): 2.5-4 ms
; of GPU for sub-pixel detail that cannot be told apart in a screenshot. The output-sized history is the engine's own
; High setting.
r.TSR.History.ScreenPercentage=100
; nothing is statically lit (r.AllowStaticLighting=False): the indirect lighting cache has nothing to serve, yet it
; was updated for every movable primitive, every frame
r.IndirectLightingCache=0

